name: lu-det-scaling
on:
  push:
    branches: [fast-det-scaling]
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        n: [40, 44, 48]
        repetition: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get cache
        run: lake exe cache get
      - name: benchmark n=${{ matrix.n }}, repetition ${{ matrix.repetition }}
        run: |
          set -o pipefail
          lake build Mathlib.Tactic.LUDet Mathlib.Tactic.NormRank
          source_file="bench/scaling/Bench${{ matrix.n }}.lean"
          sed '/-- Alternate the order/,$d' "$source_file" > /tmp/Bench.lean
          if (( ${{ matrix.repetition }} % 2 )); then
            awk '/^example : Matrix.det/{p=1} p{print} p && /^  lu_det/{exit}' "$source_file" >> /tmp/Bench.lean
            printf '%s\n' 'set_option maxHeartbeats 4000000 in' >> /tmp/Bench.lean
            awk '/^example : Matrix.rank/{p=1} p{print} p && /^  eval_rank/{exit}' "$source_file" >> /tmp/Bench.lean
          else
            printf '%s\n' 'set_option maxHeartbeats 4000000 in' >> /tmp/Bench.lean
            awk '/^example : Matrix.rank/{p=1} p{print} p && /^  eval_rank/{exit}' "$source_file" >> /tmp/Bench.lean
            awk '/^example : Matrix.det/{p=1} p{print} p && /^  lu_det/{exit}' "$source_file" >> /tmp/Bench.lean
          fi
          { /usr/bin/time -f "[n=${{ matrix.n }} rep=${{ matrix.repetition }}] wall %e s" lake env lean /tmp/Bench.lean; } 2>&1 |
            grep -E "LUDet.tacticLu_det took|evalRank took|simp took|elaboration took|type checking took|wall" |
            sed "s/^/[n=${{ matrix.n }} rep=${{ matrix.repetition }}] /"
