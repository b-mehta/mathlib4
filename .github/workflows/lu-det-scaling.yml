name: lu-det-scaling
on:
  push:
    branches: [fast-det-scaling]
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        n: [16, 20, 24, 28, 32, 36, 40, 44, 48]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get cache
        run: lake exe cache get
      - name: benchmark n=${{ matrix.n }}
        run: |
          set -o pipefail
          lake build Mathlib.Tactic.LUDet Mathlib.Tactic.NormRank
          { /usr/bin/time -f "[n=${{ matrix.n }}] wall %e s" lake env lean "bench/scaling/Bench${{ matrix.n }}.lean"; } 2>&1 |
            grep -E "LUDet.tacticLu_det took|evalRank took|simp took|elaboration took|type checking took|wall" |
            sed "s/^/[n=${{ matrix.n }}] /"
